[server]
headless = true
port = 8501
maxUploadSize = 2000
# Reload the app automatically when app.py or video_maker.py change (no restart needed)
runOnSave = true
fileWatcherType = "poll"

[client]
# hide Streamlit's Deploy button and developer menu
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#FFE14D"
